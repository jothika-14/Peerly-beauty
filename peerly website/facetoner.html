<html>
    <head>
        <title>
            Face Toner
        </title>
        <style>
            body{
                background-image: url(fig1.webp);  
                background-size: 100% 100%;
            }
            h1{
            text-align: center;
            font-size: 70px;
            }
            #stk
            {
                -webkit-text-stroke: 3px blue;
                color: white;
                animation: thara 10s infinite;
            }
            @keyframes thara
            {
                0%{
                    color:white;
                }
                50%{
                    color:#d0eb34;
                }
                100%{
                    color:#a1eb34;
                    -webkit-text-stroke: 3px orange;
                }
            }
            #stk:hover
            {
                animation-play-state: paused;
            }
            img{
                padding-left:40%;
                height:50%;
                width:20%;
                }
            p{
                padding-left:40%;
                padding-right: 40%;
            }

        </style>
    </head>

        <div id="f1">
    <section>
        <aside>
            <p></p>
        </aside>
        <h1 id="stk">FACE TONER</h1>
        <img src="facetoner.jpg">
        <p>A face toner is a liquid skincare product that removes dirt, oil, and makeup, and helps restore the skin's pH balance. Toners can also help tighten pores, soothe the skin, and improve the effectiveness of other skincare products. </p>
        </div>
    </section>
    </body>
</html>
